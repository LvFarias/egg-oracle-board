<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			body {
				width: 450px;
				padding: 10px;
				color: #efeff1;
				background: #1a1a1e;
				font-family: sans-serif;
			}
			.form-group {
				margin-bottom: 10px;
			}
			label {
				display: block;
				font-size: 12px;
				margin-bottom: 3px;
				font-weight: bold;
			}
			input,
			select {
				width: 100%;
				padding: 5px;
				background: #242429;
				color: #efeff1;
				border: 1px solid #3b3b41;
				border-radius: 4px;
				box-sizing: border-box;
			}
			button {
				width: 100%;
				background: #4f33d4;
				color: #efeff1;
				border: none;
				padding: 8px;
				cursor: pointer;
				border-radius: 4px;
				font-weight: bold;
				margin-top: 10px;
			}
			button:hover {
				background: #4e33d4e6;
			}
			#btnRecordVotes {
				color: #242429;
				background: #f9b307;
			}
			#btnRecordVotes:hover {
				background: #b39800e6;
			}
			#btnExportVotes {
				background: #337ed5;
				color: #efeff1;
			}
			#btnExportVotes:hover {
				background: #337ed5e6;
			}
			#btnUpdateGlobal {
				display: none;
				color: #efeff1;
				background: #3d9e60;
			}
			#btnUpdateGlobal:hover {
				background: #3d9e60e6;
			}
			#btnExport,
			#btnImport {
				color: #efeff1;
				background: #337ed5;
			}
			#btnExport:hover,
			#btnImport:hover {
				background: #337ed5e6;
			}
			#btnReset {
				color: #efeff1;
				background: #d93e44;
			}
			#btnReset:hover {
				background: #d93e44e6;
			}
			.actions {
				display: flex;
				gap: 5px;
				margin-top: 10px;
			}
			.actions button {
				font-size: 11px;
				padding: 6px;
				margin-top: 0;
			}
			pre {
				color: #dbdbdd;
				background: #1f202f;
				padding: 10px;
				border-radius: 4px;
				overflow-x: auto;
				font-family: monospace;
				font-size: 11px;
				white-space: pre-wrap;
			}
			.status {
				font-size: 11px;
				color: #ffac34;
				margin-top: 5px;
				text-align: center;
				height: 14px;
			}
		</style>
	</head>
	<body>
		<div style="display: flex; gap: 10px; margin-bottom: 10px">
			<div class="form-group" style="flex: 1">
				<label>Target Group:</label>
				<select id="groupSelect">
					<option value="BN">BN</option>
					<option value="1q">1q</option>
				</select>
			</div>
			<div class="form-group" style="flex: 1">
				<label>Votes Date:</label>
				<select id="dateSelect"></select>
			</div>
		</div>

		<div style="display: flex; gap: 5px">
			<button id="btnRecordVotes" style="margin-top: 0">
				Record Votes
			</button>
			<button id="btnExportVotes" style="margin-top: 0">
				Export Votes
			</button>
		</div>

		<div style="display: flex; gap: 5px; margin-top: 10px">
			<div class="form-group" style="flex: 1">
				<label>Size:</label
				><input
					type="number"
					id="correctSize"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1">
				<label>Egg:</label
				><input
					type="number"
					id="correctEgg"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1">
				<label>Token:</label
				><input
					type="number"
					id="correctToken"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1">
				<label>Reward:</label
				><input
					type="number"
					id="correctReward"
					min="0"
					max="10"
					value="0"
				/>
			</div>
		</div>

		<button id="btnCalculate">Calculate Current Contract</button>
		<button id="btnUpdateGlobal">Update Global Leaderboard</button>

		<div class="actions">
			<button id="btnExport">Export Leaderboard</button>
			<input
				type="file"
				id="dbImport"
				accept=".json"
				style="display: none"
			/>
			<button id="btnImport">Import Leaderboard</button>
			<button id="btnReset">Reset Leaderboard</button>
		</div>

		<div id="status" class="status"></div>
		<pre id="output"></pre>
		<script src="popup.js"></script>
	</body>
</html>
