<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<script src="./src/utils.js" defer></script>
		<script src="./src/db.js" defer></script>
		<script src="./src/discord.js" defer></script>
		<script src="./src/ranking.js" defer></script>
		<script src="./src/week_config.js" defer></script>
		<script src="./src/week_results.js" defer></script>
		<script src="./src/data_manager.js" defer></script>
		<script src="./src/main.js" defer></script>
		<style>
			body {
				width: 450px;
				max-height: 100dvh;
				padding: 10px;
				color: #efeff1;
				background: #1a1a1e;
				font-family: sans-serif;
			}
			h2 {
				font-size: 14px;
				margin-top: 15px;
				margin-bottom: 8px;
				color: #ffac34;
				border-bottom: 1px solid #3b3b41;
				padding-bottom: 4px;
			}
			.form-group {
				margin-bottom: 10px;
			}
			.form-group label {
				display: block;
				font-size: 12px;
				margin-bottom: 3px;
				font-weight: bold;
			}
			.form-group input,
			.form-group select {
				width: 100%;
				padding: 5px;
				background: #242429;
				color: #efeff1;
				border: 1px solid #3b3b41;
				border-radius: 4px;
				box-sizing: border-box;
			}
			button {
				width: 100%;
				background: #4f33d4;
				color: #efeff1;
				border: none;
				padding: 8px;
				cursor: pointer;
				border-radius: 4px;
				font-weight: bold;
				margin-top: 10px;
			}
			button:hover {
				background: #4e33d4e6;
			}
			#btnGeneratePolls {
				background: #3d9e60;
				margin-top: 0;
			}
			#btnGeneratePolls:hover {
				background: #3d9e60e6;
			}
			#btnCopyPingUsers {
				background: #337ed5;
				margin-top: 0;
			}
			#btnCopyPingUsers:hover {
				background: #337ed5e6;
			}
			#btnImportWeek {
				background: #337ed5;
				margin-top: 0;
			}
			#btnImportWeek:hover {
				background: #337ed5e6;
			}
			#btnExtractVotes {
				color: #242429;
				background: #f9b307;
				margin-top: 0;
			}
			#btnExtractVotes:hover {
				background: #b39800e6;
			}
			#btnExportWeek {
				background: #337ed5;
				margin-top: 0;
			}
			#btnExportWeek:hover {
				background: #337ed5e6;
			}
			#btnCalculate {
				background: #4f33d4;
			}
			#btnUpdateGlobal {
				display: none;
				color: #efeff1;
				background: #3d9e60;
			}
			#btnUpdateGlobal:hover {
				background: #3d9e60e6;
			}
			#btnReset {
				color: #efeff1;
				background: #d93e44;
				margin-top: 15px;
			}
			#btnReset:hover {
				background: #d93e44e6;
			}
			pre {
				color: #dbdbdd;
				background: #1f202f;
				padding: 10px;
				border-radius: 4px;
				overflow-x: auto;
				max-height: 250px;
				font-family: monospace;
				font-size: 11px;
				white-space: pre-wrap;
				margin: 0;
			}
			.status {
				font-size: 11px;
				color: #ffac34;
				margin-top: 5px;
				text-align: center;
				height: 14px;
			}
			.output-container {
				position: relative;
				margin-top: 10px;
			}
			.copy-btn {
				position: absolute;
				top: 5px;
				right: 5px;
				background: #3b3b41;
				color: #efeff1;
				border: none;
				border-radius: 4px;
				padding: 4px 8px;
				cursor: pointer;
				font-size: 14px;
				width: auto;
				margin-top: 0;
			}
			.copy-btn:hover {
				background: #4f33d4;
			}
			#importText {
				display: none;
				width: 100%;
				height: 100px;
				margin-top: 10px;
				background: #242429;
				color: #efeff1;
				border: 1px solid #3b3b41;
				border-radius: 4px;
				padding: 5px;
				box-sizing: border-box;
			}
			#btnConfirmImport {
				display: none;
				background: #3d9e60;
			}
			#btnConfirmImport:hover {
				background: #3d9e60e6;
			}
		</style>
	</head>
	<body>
		<div style="display: flex; gap: 10px; margin-bottom: 5px">
			<div class="form-group" style="flex: 1">
				<label>Group:</label>
				<div style="display: flex; gap: 5px">
					<select id="groupSelect"></select>
					<button
						id="btnDeleteGroup"
						style="
							width: auto;
							background: #d93e44;
							margin-top: 0;
							padding: 5px 10px;
						"
						title="Delete Group"
					>
						X
					</button>
				</div>
			</div>
			<div class="form-group" style="flex: 1">
				<label>Season:</label>
				<input type="text" id="seasonName" value="Season 1" />
			</div>
			<div class="form-group" style="flex: 1">
				<label>Start Date:</label>
				<input type="date" id="seasonStartDate" />
			</div>
			<div class="form-group" style="flex: 1">
				<label>Week:</label>
				<select id="weekSelect"></select>
			</div>
		</div>
		<h2>Start Week Config</h2>
		<div style="display: flex; gap: 5px; margin-bottom: 5px">
			<button id="btnGeneratePolls">Generate Polls</button>
			<button id="btnCopyPingUsers">Copy Ping-Users</button>
		</div>
		<h2>Week Results</h2>
		<div style="display: flex; gap: 5px; margin-bottom: 10px">
			<button id="btnImportWeek">Import Week</button>
			<button id="btnExtractVotes">Extract Votes</button>
			<button id="btnExportWeek">Export Week</button>
		</div>
		<div
			style="
				display: flex;
				gap: 5px;
				margin-bottom: 10px;
				flex-wrap: wrap;
			"
		>
			<div class="form-group" style="flex: 1; min-width: 45px">
				<label>Max SR:</label
				><input
					type="number"
					id="correctMaxSR"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1; min-width: 45px">
				<label>Egg:</label
				><input
					type="number"
					id="correctEgg"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1; min-width: 45px">
				<label>Size:</label
				><input
					type="number"
					id="correctSize"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1; min-width: 45px">
				<label>Reward:</label
				><input
					type="number"
					id="correctReward"
					min="0"
					max="10"
					value="0"
				/>
			</div>
			<div class="form-group" style="flex: 1; min-width: 45px">
				<label>Duration:</label
				><input
					type="number"
					id="correctDuration"
					min="0"
					max="10"
					value="0"
				/>
			</div>
		</div>
		<button id="btnCalculate">Calculate Week Ranking</button>
		<button id="btnUpdateGlobal">Update Season Ranking</button>
		<textarea
			id="importText"
			placeholder="Paste the leaderboard table here... It will replace the selected week's scores and update the Global ranking."
		></textarea>
		<button id="btnConfirmImport">Confirm Import</button>
		<div id="status" class="status"></div>
		<div
			id="pollOutputContainer"
			class="output-container"
			style="display: none"
		>
			<button id="btnCopyPolls" class="copy-btn" title="Copy Polls">
				📋
			</button>
			<pre id="pollOutput"></pre>
		</div>
		<div
			id="mainOutputContainer"
			class="output-container"
			style="display: none"
		>
			<button
				id="btnCopyOutput"
				class="copy-btn"
				title="Copy Leaderboard"
			>
				📋
			</button>
			<pre id="output"></pre>
		</div>
		<button id="btnReset">Reset Season Leaderboard</button>
	</body>
</html>
